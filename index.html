<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VenuxMail — disposable inbox</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12141a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VenuxMail">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain"></div>

  <header class="topbar">
    <div class="wordmark">Venux<span>Mail</span></div>
    <button class="link-btn" id="restoreToggle">Restore a saved address</button>
  </header>

  <div class="install-banner" id="installBanner" hidden>
    <span>Install VenuxMail as an app on your phone</span>
    <button class="btn btn-primary btn-small" id="installBtn">Install</button>
    <button class="icon-btn" id="dismissInstall" title="Dismiss">dismiss</button>
  </div>

  <section class="restore-panel" id="restorePanel" hidden>
    <input type="text" id="restoreInput" placeholder="Paste your recovery code" autocomplete="off" />
    <button class="btn btn-ghost" id="restoreSubmit">Restore</button>
    <span class="hint" id="restoreHint"></span>
  </section>

  <main>
    <section class="hero">
      <div class="postmark" id="postmark" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <circle class="ring-track" cx="60" cy="60" r="52" />
          <circle class="ring-progress" id="ringProgress" cx="60" cy="60" r="52" />
        </svg>
        <div class="postmark-icon" id="postmarkIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="2.5" y="5" width="19" height="14" rx="1.5"/>
            <path d="M3 6.5l9 7 9-7"/>
          </svg>
        </div>
      </div>

      <div class="address-block">
        <p class="eyebrow" id="statusLabel">generating your inbox…</p>
        <div class="address-row">
          <code id="addressText">&hellip;</code>
          <button class="icon-btn" id="copyBtn" title="Copy address">copy</button>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="newBtn">New address</button>
          <button class="btn btn-outline" id="saveBtn">Save for later</button>
          <button class="btn btn-outline" id="refreshBtn">Check inbox</button>
        </div>
        <p class="save-code" id="saveCodeMsg" hidden></p>
      </div>
    </section>

    <section class="inbox">
      <div class="inbox-header">
        <h2>Inbox</h2>
        <span class="inbox-count" id="inboxCount">0 messages</span>
      </div>
      <ul class="message-list" id="messageList">
        <li class="empty-state" id="emptyState">
          <p>Nothing here yet.</p>
          <p class="muted">Mail sent to this address will show up automatically.</p>
        </li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
